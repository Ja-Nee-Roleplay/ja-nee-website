name: Build and deploy Ja-Nee RP to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: cpanel-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out website
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.12'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run code checks
        run: npm run lint

      - name: Build static website for the custom domain root
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Upload built website to cPanel over FTPS
        if: ${{ vars.CPANEL_DEPLOY_ENABLED == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_HOST }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ${{ vars.CPANEL_FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.CPANEL_FTP_PORT || '21' }}
          local-dir: ./dist/
          server-dir: ${{ vars.CPANEL_FTP_SERVER_DIR || './' }}
          dry-run: ${{ vars.CPANEL_DEPLOY_DRY_RUN == 'true' }}

      - name: Explain that cPanel deployment is not enabled yet
        if: ${{ vars.CPANEL_DEPLOY_ENABLED != 'true' }}
        run: echo "::notice title=cPanel deployment is disabled::Build passed. Configure the documented GitHub secrets and variables, then set CPANEL_DEPLOY_ENABLED to true."
